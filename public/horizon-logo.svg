<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%" style="font-family: &#39;Montserrat&#39;, &#39;Orbitron&#39;, &#39;Segoe UI&#39;, &#39;Helvetica Neue&#39;, Arial, sans-serif;">
  <defs>
    <!-- Sky Sunset Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b468c" />
      <stop offset="30%" stop-color="#2b7cb3" />
      <stop offset="60%" stop-color="#d98b4e" />
      <stop offset="85%" stop-color="#ff7b29" />
      <stop offset="100%" stop-color="#ffe699" />
    </linearGradient>

    <!-- Sunburst Core Radial Gradient -->
    <radialGradient id="sunCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="30%" stop-color="#fff8cc" stop-opacity="0.95" />
      <stop offset="65%" stop-color="#ffae42" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#ff6600" stop-opacity="0" />
    </radialGradient>

    <!-- Radar Wedge Gradient -->
    <linearGradient id="radarSweep" x1="0%" y1="100%" x2="80%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#7ce8ff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#88f0ff" stop-opacity="0.55" />
    </linearGradient>

    <!-- Deep Ocean Earth Gradient -->
    <radialGradient id="oceanGrad" cx="50%" cy="10%" r="85%">
      <stop offset="0%" stop-color="#19679e" />
      <stop offset="35%" stop-color="#09366e" />
      <stop offset="75%" stop-color="#041838" />
      <stop offset="100%" stop-color="#020b1c" />
    </radialGradient>

    <!-- Continent Fill Gradient -->
    <linearGradient id="landGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#218c74" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0b4747" stop-opacity="0.55" />
    </linearGradient>

    <!-- Glowing Horizon Curve Gradient -->
    <linearGradient id="horizonBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6a00" stop-opacity="0" />
      <stop offset="15%" stop-color="#ff9436" stop-opacity="0.75" />
      <stop offset="35%" stop-color="#ffd27d" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="65%" stop-color="#ffd27d" stop-opacity="0.95" />
      <stop offset="85%" stop-color="#ff9436" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#ff6a00" stop-opacity="0" />
    </linearGradient>

    <!-- Neon Cyan/Orange Outer Sphere Rim -->
    <linearGradient id="neonRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="28%" stop-color="#ff9d3b" />
      <stop offset="55%" stop-color="#00d9ff" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <!-- Magnifying Glass Rim Gradient -->
    <linearGradient id="magnifierRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f7ff" />
      <stop offset="40%" stop-color="#ffcf96" />
      <stop offset="75%" stop-color="#ffa254" />
      <stop offset="100%" stop-color="#b8eaff" />
    </linearGradient>

    <!-- Magnifying Glass Handle Gradient -->
    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6cc3e0" stop-opacity="0.65" />
      <stop offset="50%" stop-color="#c2e9fb" stop-opacity="0.8" />
      <stop offset="85%" stop-color="#e6a05c" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#ffd39b" stop-opacity="0.95" />
    </linearGradient>

    <!-- "SEARCH" Warm Gold/Orange Gradient -->
    <linearGradient id="searchWordGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffae52" />
      <stop offset="50%" stop-color="#f7b267" />
      <stop offset="100%" stop-color="#e8994a" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Intense Neon Cyan Glow -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b1" />
      <feGaussianBlur stdDeviation="8" result="b2" />
      <feGaussianBlur stdDeviation="16" result="b3" />
      <feMerge>
        <feMergeNode in="b3" />
        <feMergeNode in="b2" />
        <feMergeNode in="b1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Strong Drop Shadow for Center Text Legibility -->
    <filter id="centerTextShadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000814" flood-opacity="0.9" />
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.85" />
    </filter>

    <!-- Main Globe Circular Clip -->
    <clipPath id="globeClip">
      <circle cx="600" cy="295" r="200" />
    </clipPath>

    <!-- Lower Earth Clip (Below the Curved Horizon) -->
    <clipPath id="earthHalfClip">
      <path d="M 380,295 Q 600,268 820,295 L 820,510 L 380,510 Z" />
    </clipPath>
  </defs>

  <!-- TRANSPARENT BACKGROUND (No background rect) -->

  <!-- ========================================== -->
  <!-- 1. OUTER ORBITAL RINGS & STARBURST FLARES  -->
  <!-- ========================================== -->
  <g id="orbital-hud">
    <!-- Outer Dashed Orbit Circle -->
    <circle cx="600" cy="295" r="244" fill="none" stroke="#4fd2ff" stroke-width="1.2" stroke-dasharray="8 6" opacity="0.45" />
    
    <!-- Mid Thin Orbit Arcs -->
    <path d="M 374,230 A 232,232 0 0,1 815,210" fill="none" stroke="#5ce1ff" stroke-width="1.5" opacity="0.6" />
    <path d="M 382,375 A 232,232 0 0,0 818,375" fill="none" stroke="#3898ff" stroke-width="1.5" opacity="0.55" />
    <path d="M 365,335 A 238,238 0 0,1 375,215" fill="none" stroke="#7ce8ff" stroke-width="2" stroke-dasharray="14 6 4 6" opacity="0.7" />

    <!-- Top-Right Starburst Lens Flare (On Rim) -->
    <g transform="translate(760, 142)">
      <circle cx="0" cy="0" r="14" fill="#00e5ff" opacity="0.35" filter="url(#softGlow)" />
      <line x1="-45" y1="45" x2="45" y2="-45" stroke="#a6f4ff" stroke-width="1.8" opacity="0.85" />
      <line x1="-22" y1="-22" x2="22" y2="22" stroke="#a6f4ff" stroke-width="1.2" opacity="0.65" />
      <circle cx="0" cy="0" r="4" fill="#ffffff" filter="url(#neonGlow)" />
    </g>

    <!-- Bottom-Left Starburst Lens Flare (On Rim) -->
    <g transform="translate(436, 442)">
      <circle cx="0" cy="0" r="12" fill="#00e5ff" opacity="0.35" filter="url(#softGlow)" />
      <line x1="-40" y1="40" x2="40" y2="-40" stroke="#a6f4ff" stroke-width="1.8" opacity="0.85" />
      <line x1="-18" y1="-18" x2="18" y2="18" stroke="#a6f4ff" stroke-width="1.2" opacity="0.65" />
      <circle cx="0" cy="0" r="3.5" fill="#ffffff" filter="url(#neonGlow)" />
    </g>
  </g>

  <!-- ========================================== -->
  <!-- 2. MAIN GLOBE (SKY, SUNBURST & 3D EARTH)   -->
  <!-- ========================================== -->
  <g clip-path="url(#globeClip)">
    <!-- A. SKY HALF -->
    <rect x="390" y="85" width="420" height="230" fill="url(#skyGrad)" />

    <!-- Soft Sunbeams / Rays Radiating from Center Horizon -->
    <g opacity="0.35" fill="#fff3c4" filter="url(#softGlow)">
      <polygon points="600,275 430,120 465,100" />
      <polygon points="600,275 500,95 540,90" />
      <polygon points="600,275 580,85 615,85" />
      <polygon points="600,275 655,95 690,110" />
      <polygon points="600,275 735,140 765,170" />
    </g>

    <!-- Radar Scan Sector in Upper-Right Sky -->
    <path d="M 600,275 L 600,115 A 160,160 0 0,1 702,152 Z" fill="url(#radarSweep)" />
    <!-- Dashed Radar Arcs inside Sector -->
    <path d="M 600,115 A 160,160 0 0,1 702,152" fill="none" stroke="#99f3ff" stroke-width="2" stroke-dasharray="8 6" opacity="0.85" />
    <path d="M 600,132 A 143,143 0 0,1 691,165" fill="none" stroke="#99f3ff" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.65" />
    <!-- Crisp Radar Sweep Edge Line -->
    <line x1="600" y1="275" x2="702" y2="152" stroke="#b8f7ff" stroke-width="2" opacity="0.9" filter="url(#softGlow)" />

    <!-- Inner Sky HUD Thin Circle -->
    <circle cx="600" cy="295" r="158" fill="none" stroke="#9ceeff" stroke-width="1" stroke-dasharray="180 15 10 15" opacity="0.55" />

    <!-- Blazing Rising Sun at Horizon Center -->
    <circle cx="600" cy="272" r="78" fill="url(#sunCore)" />
    <circle cx="600" cy="272" r="32" fill="#ffffff" filter="url(#softGlow)" />

    <!-- B. EARTH HALF (Below Horizon) -->
    <g clip-path="url(#earthHalfClip)">
      <!-- Deep Blue Ocean Base -->
      <rect x="390" y="265" width="420" height="240" fill="url(#oceanGrad)" />

      <!-- 3D Wireframe Latitude Lines -->
      <g fill="none" stroke="#18b7ff" stroke-width="1" opacity="0.45">
        <path d="M 405,310 Q 600,335 795,310" />
        <path d="M 412,350 Q 600,385 788,350" />
        <path d="M 435,392 Q 600,432 765,392" />
        <path d="M 472,435 Q 600,472 728,435" />
        <path d="M 520,470 Q 600,495 680,470" />
      </g>

      <!-- 3D Wireframe Longitude Lines -->
      <g fill="none" stroke="#18b7ff" stroke-width="1" opacity="0.45">
        <path d="M 600,275 L 600,495" />
        <path d="M 555,276 Q 535,390 568,492" />
        <path d="M 510,280 Q 465,385 535,488" />
        <path d="M 465,285 Q 405,375 495,475" />
        <path d="M 645,276 Q 665,390 632,492" />
        <path d="M 690,280 Q 735,385 665,488" />
        <path d="M 735,285 Q 795,375 705,475" />
      </g>

      <!-- Fine Polar Grid Detail at Bottom of Globe -->
      <g fill="none" stroke="#00d9ff" stroke-width="0.7" opacity="0.35">
        <path d="M 495,452 Q 600,482 705,452" />
        <path d="M 508,462 Q 600,490 692,462" />
        <path d="M 525,478 Q 600,500 675,478" />
      </g>

      <!-- Continents with Glowing Mint-Green Outlines -->
      <g fill="url(#landGrad)" stroke="#4df7c8" stroke-width="1.4" stroke-linejoin="round">
        <!-- North & Central America (Left) -->
        <path d="M 432,285 Q 445,295 462,292 L 478,278 L 492,282 L 475,302 L 455,310 L 452,324 L 468,338 L 455,342 L 438,325 L 432,305 Z" />
        <!-- Caribbean Islands -->
        <path d="M 468,322 L 482,325 M 486,329 L 495,331" stroke-width="1.8" stroke-linecap="round" />
        <!-- South America (Bottom Left) -->
        <path d="M 472,344 L 498,352 L 538,378 L 532,412 L 512,445 L 516,456 L 502,450 L 492,410 L 472,375 Z" />
        <!-- Europe / Mediterranean (Top Center) -->
        <path d="M 575,278 L 595,275 L 622,277 L 642,286 L 632,296 L 615,292 L 605,298 L 588,292 L 578,296 Z" />
        <!-- Africa (Center / Right-Center) -->
        <path d="M 576,302 L 608,298 L 635,306 L 664,335 L 655,365 L 642,412 L 620,425 L 608,395 L 602,362 L 574,348 L 564,325 Z" />
        <!-- Madagascar -->
        <path d="M 658,388 L 666,382 L 662,404 L 654,400 Z" />
        <!-- Middle East & Asia (Right Side, behind Magnifying Glass) -->
        <path d="M 645,285 L 685,280 L 755,288 L 762,315 L 742,345 L 725,322 L 705,345 L 692,318 L 668,328 L 652,305 Z" />
      </g>

      <!-- Sunlight Reflection on Ocean Below Sun -->
      <ellipse cx="600" cy="285" rx="75" ry="18" fill="#99f3ff" opacity="0.3" filter="url(#softGlow)" />
    </g>

    <!-- Inner 3D Rim Shading -->
    <circle cx="600" cy="295" r="200" fill="none" stroke="#00e5ff" stroke-width="6" opacity="0.25" filter="url(#softGlow)" />
  </g>

  <!-- ========================================== -->
  <!-- 3. GLOBE NEON OUTER RIM                    -->
  <!-- ========================================== -->
  <circle cx="600" cy="295" r="200" fill="none" stroke="url(#neonRim)" stroke-width="4" filter="url(#neonGlow)" />
  <circle cx="600" cy="295" r="200" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.75" />

  <!-- ========================================== -->
  <!-- 4. SWEEPING GLOWING HORIZON BEAM           -->
  <!-- ========================================== -->
  <!-- Outer Orange/Gold Atmospheric Glow -->
  <path d="M 285,308 Q 600,248 915,308" fill="none" stroke="url(#horizonBeam)" stroke-width="12" filter="url(#softGlow)" opacity="0.9" />
  <!-- Intense White-Hot Horizon Core Line -->
  <path d="M 320,304 Q 600,252 880,304" fill="none" stroke="url(#horizonBeam)" stroke-width="4.5" />
  <path d="M 410,292 Q 600,258 790,292" fill="none" stroke="#ffffff" stroke-width="2.5" />

  <!-- ========================================== -->
  <!-- 5. TRANSLUCENT MAGNIFYING GLASS (RIGHT)    -->
  <!-- ========================================== -->
  <g id="magnifying-glass" transform="translate(722, 282)">
    <!-- Connector Neck & Glass Handle (Angled 48 deg) -->
    <g transform="rotate(48)">
      <!-- Connector Neck -->
      <rect x="78" y="-9" width="18" height="18" rx="3" fill="#7be0ff" fill-opacity="0.5" stroke="#bdf2ff" stroke-width="1.5" />
      <!-- Cylindrical Translucent Handle -->
      <rect x="94" y="-15" width="112" height="30" rx="15" fill="url(#handleGrad)" stroke="#ffdfb8" stroke-width="2" filter="url(#softGlow)" />
      <!-- Inner Handle Glass Tube Highlight -->
      <line x1="104" y1="-7" x2="194" y2="-7" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.75" />
      <line x1="104" y1="8" x2="192" y2="8" stroke="#5cc8ff" stroke-width="2" stroke-linecap="round" opacity="0.5" />
      <!-- Warm Glowing Tip Flare on Handle End -->
      <circle cx="194" cy="2" r="10" fill="#ffae42" opacity="0.6" filter="url(#softGlow)" />
    </g>

    <!-- Magnifier Outer Drop Shadow -->
    <circle cx="0" cy="4" r="82" fill="none" stroke="#020d1f" stroke-width="8" opacity="0.55" filter="url(#softGlow)" />

    <!-- Subtle Lens Interior Tint -->
    <circle cx="0" cy="0" r="78" fill="#ffffff" fill-opacity="0.06" />

    <!-- Inner Bevel Ring & Glossy Arcs -->
    <circle cx="0" cy="0" r="68" fill="none" stroke="#a8ebff" stroke-width="1.8" opacity="0.65" />
    <path d="M -52,-38 A 64,64 0 0,1 52,-38" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.45" />
    <path d="M -56,32 A 64,64 0 0,0 48,42" fill="none" stroke="#ffae52" stroke-width="3" stroke-linecap="round" opacity="0.4" />

    <!-- Thick Glowing Glass Outer Rim -->
    <circle cx="0" cy="0" r="78" fill="none" stroke="url(#magnifierRim)" stroke-width="11" filter="url(#softGlow)" opacity="0.7" />
    <circle cx="0" cy="0" r="78" fill="none" stroke="url(#magnifierRim)" stroke-width="9" />
    <circle cx="0" cy="0" r="82.5" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.85" />
    <circle cx="0" cy="0" r="73.5" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.7" />
  </g>

  <!-- ========================================== -->
  <!-- 6. CENTERED TYPOGRAPHY ("HORIZON SEARCH")  -->
  <!-- ========================================== -->
  <g id="center-logo-text" filter="url(#centerTextShadow)">
    <!-- "HORIZON" - Bold, Wide, Pure White -->
    <text x="635" y="370" text-anchor="end" fill="#ffffff" font-size="78" font-weight="900" letter-spacing="3" style="text-transform: uppercase;">
      HORIZON
    </text>

    <!-- "SEARCH" - Sleek Thin Weight in Warm Sunset Gold -->
    <text x="658" y="370" text-anchor="start" fill="url(#searchWordGrad)" font-size="78" font-weight="300" letter-spacing="4" style="text-transform: uppercase;">
      SEARCH
    </text>
  </g>
</svg>